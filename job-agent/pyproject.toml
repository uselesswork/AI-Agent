[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
description = "一个基于证据分析简历与实习岗位描述匹配度的 AI Agent。"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=2.38,<3",
    "pymupdf>=1.25,<2",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "pymysql>=1.1,<2",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]
e2e = [
    "playwright>=1.50,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "auth_real: 使用真实账号会话和 CSRF 检查的认证测试",
    "browser_e2e: 独立 SQLite 与真实浏览器的端到端测试，需显式启用",
]

[tool.ruff]
line-length = 100
target-version = "py311"
